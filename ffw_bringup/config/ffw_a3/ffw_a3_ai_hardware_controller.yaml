/**:
  spring_actuator_controller:
    ros__parameters:
      joints:
        - gripper_l_joint1
        - gripper_r_joint1
      command_interfaces:
        - effort
      state_interfaces:
        - position
        - velocity
      trigger_spring_stiffness: [0.06, 0.06]
      trigger_neutral_position: [0.0, 0.0]
      trigger_damping: [0.004, 0.004]
      static_friction_scalars: [0.1, 0.1]
      static_friction_velocity_thresholds: [0.3, 0.3]
      torque_scaling_factors: [1.0, 1.0]

/**:
  joystick_controller:
    ros__parameters:
      joystick_sensors:
        - sensorxel_l_joy
        - sensorxel_r_joy
      state_interfaces:
        - JOYSTICK X VALUE
        - JOYSTICK Y VALUE
        - JOYSTICK TACT SWITCH
      sensorxel_l_joy_reverse_interfaces:
        - JOYSTICK Y VALUE
        - JOYSTICK X VALUE
      joystick_calibration_min: 0.0
      joystick_calibration_center: 2048.0
      joystick_calibration_max: 4096.0
      sensorxel_l_joy_controlled_joints:
        - head_joint1
        - head_joint2
      sensorxel_r_joy_controlled_joints:
        - lift_joint
      joint_states_topic: "/joint_states"
      sensorxel_l_joy_joint_trajectory_topic: "/leader/joystick_controller_left/joint_trajectory"
      sensorxel_r_joy_joint_trajectory_topic: "/leader/joystick_controller_right/joint_trajectory"
      sensorxel_l_joy_joint_states_stamped_topic: "/robot/head_leader/joint_states"
      sensorxel_r_joy_joint_states_stamped_topic: "/robot/lift_leader/joint_states"
      sensorxel_l_joy_jog_scale: 0.06
      sensorxel_r_joy_jog_scale: 0.01
      deadzone: 0.05
      enable_joystick_update: true
      enable_joint_jog_update: false
      enable_cmd_vel_update: false
      require_middle_pedal_for_cmd_vel: true
      middle_pedal_timeout_sec: 0.5
