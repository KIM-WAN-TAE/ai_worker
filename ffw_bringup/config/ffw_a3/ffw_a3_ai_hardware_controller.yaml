      #left_save_pose_3: [0.135, 0.0, 0.181, -2.152, 0.243, 0.851, 0.5671, 0.0]
      #right_save_pose_3: [-0.222, -0.395, 0.173, -1.253, -0.543, -0.181, 1.8201, 0.0]
      #left_save_pose_3: [0.234, 0.0, 0.898, -2.3, -0.577, 0.906, -1.693, 0.0]
