        - arm_r_joint3
        - arm_r_joint4
        - arm_r_joint5
        - arm_r_joint6
        - arm_r_joint7
        - gripper_r_joint1
      step_names: [step0, step1]
      step0: [1.57, 0.0, 0.0, -2.8, 0.0, 0.0, 0.0, 0.0]
      step1: [0.206799784966833, -0.7173517343848337, 0.32757680356301655, -2.0146680488394932, -0.42941874680873665, -0.3036203379772087, -0.5987694600634532, 0.019]

      duration: 5.0
      position_tolerance: 0.1
      velocity_tolerance: 0.01
      action_topic: '/arm_r_controller/follow_joint_trajectory'
