joint_trajectory_command_broadcaster:
  map_interface_to_joint_state:
    position: {
      type: string,
      default_value: "position",
    }
  use_urdf_to_filter: {
    type: bool,
    default_value: true,
    description: "Uses the robot_description to filter the joint trajectory.
    If true, the broadcaster will publish the data of the joints present in the URDF alone.
    If false, the broadcaster will publish the data of any interface that has type ``position``."
  }
  follower_joint_states_topic: {
    type: string,
    default_value: "/joint_states",
    description: "Topic name for subscribing to follower's joint states to check synchronization."
  }
  sync_threshold: {
    type: double,
    # default_value: 0.01,
    default_value: 0.1,
    description: "Threshold value (in radians) to determine if follower joints are synced with leader joints."
  }
  max_error: {
    type: double,
    default_value: 0.6,
    description: "Maximum error value (in radians) used for adaptive timing calculation. Errors above this value will use maximum delay."
  }
  min_error: {
    type: double,
    default_value: 0.01,
    description: "Minimum error value (in radians) used for adaptive timing calculation. Errors below this value will use minimum delay."
  }
  min_delay: {
    type: double,
    default_value: 0.0,
    description: "Minimum delay (in seconds) for adaptive timing when joints are not synced."
  }
  max_delay: {
    type: double,
    default_value: 0.4,
    description: "Maximum delay (in seconds) for adaptive timing when joints are not synced."
  }
  left_joints: {
    type: string_array,
    default_value: [],
    description: "Joint names for left arm group."
  }
  left_offsets: {
    type: double_array,
    default_value: [],
    description: "Offsets for left arm joints."
  }
  left_reverse_joints: {
    type: string_array,
    default_value: [],
    description: "Reverse joints for left arm group."
  }
  left_joint_states_stamped_topic: {
    type: string,
    default_value: "",
    description: "Topic to publish stamped joint states for the left group. If empty, derive from the group name."
  }
  right_joints: {
    type: string_array,
    default_value: [],
    description: "Joint names for right arm group."
  }
  right_offsets: {
    type: double_array,
    default_value: [],
    description: "Offsets for right arm joints."
  }
  right_reverse_joints: {
    type: string_array,
    default_value: [],
    description: "Reverse joints for right arm group."
  }
  right_joint_states_stamped_topic: {
    type: string,
    default_value: "",
    description: "Topic to publish stamped joint states for the right group. If empty, derive from the group name."
  }
  left_enabled_init: {
    type: bool,
    default_value: false,
    description: "Initial enable state for left arm group."
  }
  right_enabled_init: {
    type: bool,
    default_value: false,
    description: "Initial enable state for right arm group."
  }
  teleop_reference_mode: {
    type: string,
    default_value: "absolute",
    description: "Leader reference mapping: 'absolute' forwards transformed leader joints; 'relative' applies Cyclo-style end-effector pose displacement from enable-time anchors.",
    read_only: true
  }
  relative_base_link: {
    type: string,
    default_value: "arm_base_link",
    description: "Base frame present in both leader and follower URDFs for relative-pose FK.",
    read_only: true
  }
  left_end_effector_link: {
    type: string,
    default_value: "arm_l_link7",
    description: "Left end-effector link used by leader/follower FK and follower velocity IK.",
    read_only: true
  }
  right_end_effector_link: {
    type: string,
    default_value: "arm_r_link7",
    description: "Right end-effector link used by leader/follower FK and follower velocity IK.",
    read_only: true
  }
  relative_kp_position: {
    type: double,
    default_value: 50.0,
    description: "Cyclo RelativePoseMode position-error gain.",
    read_only: true
  }
  relative_kp_orientation: {
    type: double,
    default_value: 50.0,
    description: "Cyclo RelativePoseMode orientation-error gain.",
    read_only: true
  }
  relative_weight_position: {
    type: double,
    default_value: 10.0,
    description: "Cartesian position weight in relative velocity IK.",
    read_only: true
  }
  relative_weight_orientation: {
    type: double,
    default_value: 1.0,
    description: "Cartesian orientation weight in relative velocity IK.",
    read_only: true
  }
  relative_damping_weight: {
    type: double,
    default_value: 0.1,
    description: "Joint-velocity damping weight, matching Cyclo's default ModeOutput damping.",
    read_only: true
  }
  toggle_debounce_duration_sec: {
    type: double,
    default_value: 0.75,
    description: "Suppress duplicate toggle commands received within this interval. Set to 0 to disable deduplication.",
    read_only: true
  }
  left_follower_joint_states_topic: {
    type: string,
    default_value: "/robot/arm_left_follower/joint_states",
    description: "Follower joint states topic for left arm (initializes last_target and refreshes it while the group is IDLE)."
  }
  right_follower_joint_states_topic: {
    type: string,
    default_value: "/robot/arm_right_follower/joint_states",
    description: "Follower joint states topic for right arm (initializes last_target and refreshes it while the group is IDLE)."
  }
  left_executed_action_topic: {
    type: string,
    default_value: "/command_source_arbiter/executed/arm_left",
    description: "Latched command actually forwarded to the left arm. Its gripper target is retained while arm joints are rebased from follower state."
  }
  right_executed_action_topic: {
    type: string,
    default_value: "/command_source_arbiter/executed/arm_right",
    description: "Latched command actually forwarded to the right arm. Its gripper target is retained while arm joints are rebased from follower state."
  }
  gripper_clutch_deadband: {
    type: double,
    default_value: 0.02,
    description: "Leader gripper movement in radians ignored after entering TELEOP so the last executed gripper action remains latched.",
    validation: {
      gt_eq<>: [0.0]
    }
  }
  gripper_clutch_scale: {
    type: double,
    default_value: 1.0,
    description: "Scale applied to leader gripper displacement after the TELEOP clutch deadband.",
    validation: {
      gt<>: [0.0]
    }
  }
  follower_robot_description_topic: {
    type: string,
    default_value: "/robot_description",
    description: "Topic name providing follower's robot_description. Used to build relative-pose kinematics and load joint limits at startup."
  }
  save_pose_duration: {
    type: double,
    default_value: 3.0,
    description: "Cubic interpolation duration (seconds) when going to a save pose."
  }
  leader_blend_duration: {
    type: double,
    # default_value: 1.2,
    default_value: 2.5,
    description: "Seconds to blend from last_target to leader value when entering state=1."
  }
  save_pose_ids: {
    type: int_array,
    default_value: [],
    description: "List of save pose IDs to pre-declare (e.g., [3,4,5]). Actual poses loaded from left_save_pose_<id> / right_save_pose_<id>."
  }
